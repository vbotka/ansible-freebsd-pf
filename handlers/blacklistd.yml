---
# handlers for blacklistd

- name: Start blacklistd
  listen: start blacklistd
  register: pf_blacklistd_started
  ansible.builtin.service:
    name: blacklistd
    state: started

- name: Stop blacklistd
  listen: stop blacklistd
  ansible.builtin.service:
    name: blacklistd
    state: stopped

- name: Restart blacklistd
  listen: restart blacklistd
  when:
    - pf_blacklistd_enable | bool
    - not (pf_blacklistd_started.changed | d(false))
  ansible.builtin.service:
    name: blacklistd
    state: restarted

# EOF
